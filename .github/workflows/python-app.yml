# Bu workflow her push yaptığında çalışır
name: CAFA 6 Project CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Repoyu sanal makineye çek
    - uses: actions/checkout@v3

    # 2. Python 3.10 kur
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    # 3. Kütüphaneleri yükle (requirements.txt çalışıyor mu testi)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install flake8 pytest && pip install -r requirements.txt; fi

    # 4. Kod kalitesini kontrol et (Yazım hatası, kullanılmayan importlar vs.)
    - name: Lint with flake8
      run: |
        # E9,F63,F7,F82 hataları varsa işlemi durdur (Ciddi hatalar)
        # Diğerleri sadece uyarı olarak kalsın
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
